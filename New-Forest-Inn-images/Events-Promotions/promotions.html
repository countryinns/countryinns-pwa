<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The New Forest Inn – Promotions</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: linear-gradient(180deg, #2e472e, #1e2b1e);
      color: #f4f4f4;
      text-align: center;
    }

    header {
      padding: 1.5rem;
      background: rgba(34, 49, 34, 0.9);
      color: #e6d8b5;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    main {
      padding: 1rem;
    }

    .card-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      margin: 2rem 0;
    }

    .card {
      background: #2e472e;
      border-radius: 14px;
      padding: 1.25rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.35);
    }

    .card img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 1rem;
    }

    .card h3 {
      margin: 0.5rem 0 0.75rem;
      color: #e6d8b5;
      font-size: 1.3rem;
    }

    .card p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #f4f4f4;
    }

    .card a {
      color: #e6d8b5;
      text-decoration: underline;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin: 2rem auto;
      max-width: 320px;
      padding-bottom: 2rem;
    }

    .buttons a {
      display: block;
      background: #3c5a3c;
      color: #fff;
      text-decoration: none;
      padding: 1rem;
      border-radius: 10px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .buttons a:hover {
      background: #4f7c4f;
    }
  </style>
</head>

<body>

<header>
  <h1>Current Promotions</h1>
</header>

<main>

  <div class="card-grid">

    <!-- Book Direct -->
    <div class="card">
      <img src="NFI DIRECT10.jpg" alt="Book Direct">
      <h3>Book Direct</h3>
      <p>
        Book direct quoting <strong>DIRECT10</strong> to get <strong>10% OFF</strong> when reserving a room with us.
      </p>
      <p>
        Book your room now at<br>
        <a href="https://web-bookings.hotels.uk.com/#/booking/46267/items/availability?k=Pz3vpXoBrwIroy0WsnQ3AMu2JNDYyNjc=" target="_blank">
          https://www.thenewforestinn.co.uk/
        </a><br>
        or call <strong>02380 80284690</strong>
      </p>
    </div>

  </div>

</main>

<div class="buttons">
  <a href="../../newforestinn.html">⬅ Back to Pub Page</a>
  <a href="../../home.html">⬅ Back to Home</a>
</div>

</body>
</html>
